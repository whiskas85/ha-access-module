scan:
  name: Valuta una lettura
  description: >-
    Inietta la lettura di una credenziale come se arrivasse da un lettore.
    Utile per provare tutta la catena senza andare al varco, e per i lettori
    che non passano dall'integrazione Tag.
  fields:
    uid:
      name: UID
      description: UID della credenziale, in qualunque formato.
      required: true
      example: "04-A1-B2-C3"
      selector:
        text:
    gate:
      name: Varco
      description: Id del varco. Se omesso si usa il primo configurato.
      example: ingresso
      selector:
        text:

start_enrollment:
  name: Abilita lettura tessera
  description: >-
    Apre la finestra di censimento: la prima tessera passata al lettore viene
    registrata invece che valutata, con UID e tecnologia rilevati da sola.
    Si chiude alla prima lettura o alla scadenza, quale delle due viene prima.
    Nasce senza titolare e finché non gliene viene assegnato uno non apre nulla.
  fields:
    seconds:
      name: Durata
      description: Secondi di attesa prima che la finestra si chiuda da sola.
      default: 60
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s

enroll_card:
  name: Censisci una tessera a mano
  description: >-
    Aggiunge una tessera al registro partendo da un UID noto, o aggiorna una
    già presente. Nell'uso normale si preferisce "Abilita lettura tessera",
    che evita di trascrivere l'UID.
  fields:
    uid:
      name: UID
      required: true
      selector:
        text:
    name:
      name: Nome
      description: Etichetta leggibile, es. "portachiavi scuola".
      selector:
        text:
    person:
      name: Titolare
      description: L'entità person a cui la tessera è abbinata.
      selector:
        entity:
          domain: person
    technology:
      name: Tecnologia
      description: >-
        Di norma va omessa: viene rilevata dall'UID. Forzarla serve solo per le
        credenziali che il lettore non può classificare — impronte, o tessere
        verificate crittograficamente da un componente dedicato. Dichiarare a
        mano una tecnologia "forte" non rende forte la credenziale: fa solo
        credere al motore di autorizzazione qualcosa che nessuno ha verificato.
      selector:
        select:
          options:
            - mifare_classic
            - iso14443a_7byte
            - mifare_ultralight
            - ntag424
            - impronta
            - sconosciuta
    note:
      name: Note
      selector:
        text:

set_card_state:
  name: Cambia stato di una tessera
  description: >-
    Attiva, disabilita o mette in blacklist. Disabilitata è una sospensione
    silenziosa; blacklist allarma se la tessera ripassa.
  fields:
    card_id:
      name: Id tessera
      description: In alternativa all'UID.
      selector:
        text:
    uid:
      name: UID
      description: In alternativa all'id.
      selector:
        text:
    state:
      name: Stato
      required: true
      selector:
        select:
          options:
            - attiva
            - disabilitata
            - blacklist

remove_card:
  name: Elimina una tessera
  description: >-
    Rimuove la tessera dal registro. Dopo l'eliminazione quell'UID risulta
    sconosciuto e non allarma più: per una tessera persa serve la blacklist,
    non l'eliminazione.
  fields:
    card_id:
      name: Id tessera
      selector:
        text:
    uid:
      name: UID
      selector:
        text:

unlock_readers:
  name: Sblocca i lettori
  description: Azzera il lockout e i fallimenti consecutivi.

clear_log:
  name: Svuota il registro accessi
  description: Cancella tutte le righe del registro. Non è reversibile.
