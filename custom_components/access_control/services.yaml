open_gate:
  name: Apri un varco
  description: >-
    Apre un varco configurato nel modulo. È l'azione da scegliere dentro le
    azioni di un lettore per far aprire porta, cancelletto o garage senza
    ripetere ogni volta entità e servizio.
  fields:
    gate:
      name: Varco
      description: Id del varco, come compare nella scheda Varchi.
      required: true
      example: porta
      selector:
        text:

scan:
  name: Valuta una lettura
  description: >-
    Inietta la lettura di una credenziale come se arrivasse da un lettore.
    Utile per provare tutta la catena senza andare al varco.
  fields:
    uid:
      name: UID
      required: true
      example: "04-A1-B2-C3"
      selector:
        text:
    device:
      name: Lettore
      description: device_id del lettore da simulare.
      selector:
        text:

start_enrollment:
  name: Aggiungi una tessera
  description: >-
    Apre la finestra di censimento: la prima tessera passata a un lettore
    registrato viene aggiunta al registro invece che valutata, con UID e tipo
    di chip rilevati da soli. Nasce senza titolare e finché non gliene assegni
    uno non apre nulla.
  fields:
    device:
      name: Lettore
      description: Su quale lettore ascoltare. Vuoto = uno qualsiasi fra i registrati.
      selector:
        text:
    seconds:
      name: Durata
      default: 60
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s

cancel_enrollment:
  name: Annulla il censimento
  description: >-
    Chiude subito la finestra di censimento, se e' aperta. Serve quando la si
    apre per sbaglio o si cambia idea: senza, resta valida fino alla prima
    tessera letta o allo scadere del minuto, e in quel minuto qualunque
    tessera passata a un lettore registrato finisce nel registro.

start_device_learning:
  name: Riconosci un lettore
  description: >-
    Apre il riconoscimento automatico: la prima lettura registra il
    DISPOSITIVO che l'ha fatta. La tessera usata viene scartata — serve solo a
    far dire al lettore «sono io», e non viene censita né valutata.
  fields:
    seconds:
      name: Durata
      default: 60
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s

enroll_card:
  name: Censisci una tessera a mano
  description: >-
    Aggiunge una tessera partendo da un UID noto. Nell'uso normale si
    preferisce «Aggiungi una tessera», che evita di trascrivere l'UID.
  fields:
    uid:
      name: UID
      required: true
      selector:
        text:
    name:
      name: Nome
      selector:
        text:
    person:
      name: Titolare
      selector:
        entity:
          domain: person
    technology:
      name: Tecnologia
      description: >-
        Di norma va omessa: viene rilevata dall'UID. Dichiarare a mano una
        tecnologia «forte» non rende forte la credenziale: fa solo credere al
        motore di autorizzazione qualcosa che nessuno ha verificato.
      selector:
        select:
          options:
            - mifare_classic
            - iso14443a_7byte
            - mifare_ultralight
            - ntag424
            - impronta
            - sconosciuta
    note:
      name: Note
      selector:
        text:

set_card_state:
  name: Cambia stato di una tessera
  description: >-
    Attiva, disabilita o mette in blacklist. Disabilitata è una sospensione
    silenziosa; blacklist allarma se la tessera ripassa.
  fields:
    card_id:
      name: Id tessera
      selector:
        text:
    uid:
      name: UID
      selector:
        text:
    state:
      name: Stato
      required: true
      selector:
        select:
          options:
            - attiva
            - disabilitata
            - blacklist

remove_card:
  name: Elimina una tessera
  description: >-
    Rimuove la tessera dal registro. Dopo l'eliminazione quell'UID risulta
    sconosciuto e non allarma più: per una tessera persa serve la blacklist.
  fields:
    card_id:
      name: Id tessera
      selector:
        text:
    uid:
      name: UID
      selector:
        text:

clear_alarm:
  name: Sblocca l'allarme
  description: >-
    Riporta il sistema in stato normale e riaccende la lettura su tutti i
    lettori. Le due cose insieme: sbloccare senza riaccendere lascerebbe un
    impianto che si dichiara normale e non legge niente.

report_tamper:
  name: Segnala manomissione
  description: >-
    Porta il sistema in allarme per manomissione di un lettore. Da chiamare
    dall'automazione agganciata al microswitch di tamper.
  fields:
    device:
      name: Lettore
      selector:
        text:

set_reading_enabled:
  name: Abilita o disabilita la lettura
  description: >-
    Accende o spegne la lettura RFID su tutti i lettori registrati, agendo
    sull'interruttore configurato su ciascuno.
  fields:
    enabled:
      name: Abilitata
      required: true
      selector:
        boolean:

clear_log:
  name: Svuota il registro accessi
  description: Cancella tutte le righe del registro. Non è reversibile.
