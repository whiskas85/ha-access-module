name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Il controllo "brands" si accontenta di una cartella `brand/` con
      # almeno `icon.png`, che l'integration porta con sé: non serve
      # disattivarlo.
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # versione fissata: un aggiornamento di ruff non deve far fallire la
      # CI su codice che non è cambiato
      - run: pip install ruff==0.16.0
      - run: ruff check custom_components scripts tests

  api:
    name: Coerenza API interne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Ruff non vede un rinomino lasciato a meta': `coordinator.is_armed` e'
      # un accesso ad attributo lecito fino a runtime, e diventa un 500 dentro
      # la vista HTTP. Questo lo prende prima.
      - run: python scripts/check_api.py

  crypto:
    name: Crittografia NTAG 424
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Una verifica crittografica sbagliata non fallisce: dice «valida» a una
      # tessera falsa. L'unico modo di accorgersene e' riprodurre i vettori
      # pubblicati da NXP, e va fatto a ogni push, non una volta sola. Versioni
      # fissate per lo stesso motivo di ruff.
      - run: pip install cryptography==50.0.1 pytest==9.1.1
      - run: pytest tests -q

  firmware:
    name: Firmware ESPHome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # La toolchain ESP-IDF pesa: senza cache si riscarica a ogni push.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-esphome-2026.8.2
      # La stessa versione dell'add-on di casa: il componente usa l'interno
      # del PN532 di ESPHome, e un cambio di versione lo puo' rompere. Quando
      # si aggiorna l'add-on, si aggiorna anche qui.
      - run: pip install esphome==2026.8.2
      - run: python scripts/prepara_firmware_ci.py
      - run: esphome compile esphome/rfid-ingresso.yaml

  js:
    name: Sintassi del pannello
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check custom_components/access_control/www/access-control-panel.js
