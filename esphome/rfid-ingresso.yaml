# ═══════════════════════════════════════════════════════════════════════════
#  PERCHÉ NON SI USA PIÙ `homeassistant.tag_scanned`
#
#  `tag_scanned` fa creare a Home Assistant un'entità `tag.*` per OGNI UID mai
#  visto. Chi arriva con un Flipper e cicla centomila codici crea centomila
#  entità: il registro tag diventa inservibile, il database si gonfia, e il
#  danno resta anche dopo che l'attaccante se n'è andato.
#
#  Questo firmware manda invece `esphome.access_control_read`, che è un evento
#  e basta: non crea niente. È il modulo, DOPO aver validato la tessera, a
#  farla comparire nel registro tag. Un UID sconosciuto resta un numero in un
#  contatore.
#
#  Se il modulo non è installato, questo nodo non fa niente di visibile: è il
#  compromesso di questa scelta, ed è quello giusto.
#
#
#  IL FALLBACK LOCALE NON C'È, E NON È UNA DIMENTICANZA
#
#  La spec §10 chiede che, se HA non risponde e siamo dentro la finestra,
#  l'ESP apra da solo il cancelletto. La §2, sotto l'intestazione "non
#  negoziabile", dice: "L'ESP32 esterno non deve mai pilotare un relè
#  collegato a un varco. Nessuna eccezione, nemmeno 'per comodità' o 'solo
#  come fallback'."
#
#  Vince §2, che anticipa alla lettera proprio questa richiesta. Il motivo
#  determinante: un fallback del genere rende l'apertura ottenibile
#  impedendo a HA di rispondere — cioè chi disturba la rete apre il cancello.
#  Trasformerebbe un guasto di rete in una primitiva di apertura, e la rete è
#  la cosa più facile da disturbare dall'esterno.
#
#  L'alternativa che copre lo stesso caso senza spostare l'attuazione fuori
#  casa è il fallback manuale già previsto dalla stessa §10: key safe con
#  combinazione, o PIN nativo della serratura.
# ═══════════════════════════════════════════════════════════════════════════
