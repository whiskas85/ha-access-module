# ═══════════════════════════════════════════════════════════════════════════
#  NODO rfid-ingresso — lettore esterno
#
#  RUOLO: legge, non decide, non attua.
#  Questo dispositivo sta FUORI dal perimetro di sicurezza. Un attaccante che
#  lo compromette completamente ottiene la capacità di DICHIARARE "ho letto il
#  codice X" — non di aprire. Nessun GPIO di questo nodo è collegato a un relè
#  di un varco, e non deve esserlo mai.
#
#  ⚠️ CAMBIO DI CONTRATTO rispetto alla versione precedente.
#  Questo firmware NON chiama più `homeassistant.tag_scanned`. Vedi in fondo
#  il perché — è la difesa contro l'inondazione di codici.
# ═══════════════════════════════════════════════════════════════════════════

substitutions:
  nome_nodo: rfid-ingresso
  # Entita' del modulo che dice se l'impianto e' in allarme. Il nodo la legge
  # da Home Assistant e si blocca da solo: vedi il blocco `binary_sensor`.
  entita_allarme: binary_sensor.controllo_accessi_allarme

esphome:
  name: ${nome_nodo}
  friendly_name: RFID Ingresso
  # Questo nodo si compila dal repository (vedi README), quindi "l'ho
  # aggiornato o no?" e' una domanda che si pone davvero — ed e' gia' costata
  # due giri di diagnosi su correzioni che non erano mai arrivate sul pezzo.
  # La versione compare nel log di boot e nelle info del dispositivo in Home
  # Assistant: si legge, invece di dedurla dai sintomi.
  # La allinea `scripts/bump.py`, non va toccata a mano.
  project:
    name: whiskas85.controllo-accessi
    version: "0.14.1"
  on_boot:
    # Priorità bassa: si esegue dopo il ripristino degli interruttori, così il
    # LED mostra lo stato vero e non quello di un istante prima.
    priority: -100
    then:
      - script.execute: led_pronto

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  # ATTENZIONE: non alzare a DEBUG/VERBOSE in esercizio. A quel livello il
  # PN532 stampa i byte letti; quando arriverà l'R503 stamperebbe i byte dei
  # template biometrici, e un template biometrico nei log è un template
  # biometrico esfiltrato.

api:
  encryption:
    key: !secret api_key

  # Il LED segue lo stato del collegamento: appena cade, diventa blu.
  on_client_connected:
    - script.execute: led_pronto
  on_client_disconnected:
    - script.execute: led_scollegato

  actions:
    # ═══════════════════════════════════════════════════════════════════════
    #  Censimento aperto o chiuso.
    #
    #  L'ESP non decide niente nemmeno qui: non sa che cos'e' un censimento,
    #  gli viene detto che colore fare. La finestra resta un fatto di Home
    #  Assistant, e questa azione e' solo la spia che la racconta a chi sta
    #  davanti al lettore — che altrimenti non ha modo di sapere se il
    #  pulsante premuto in casa e' ancora valido.
    # ═══════════════════════════════════════════════════════════════════════
    - action: modo_censimento
      variables:
        attivo: bool
      then:
        - if:
            condition:
              lambda: 'return attivo;'
            then:
              - script.execute: led_censimento
            else:
              - script.stop: led_censimento
              - script.execute: led_pronto

    # ═══════════════════════════════════════════════════════════════════════
    #  Risposta del controllo accessi.
    #  esito: "ok" | "ko" | "allarme"
    # ═══════════════════════════════════════════════════════════════════════
    - action: esito_accesso
      variables:
        esito: string
      then:
        # Fermare l'attesa PRIMA di suonare: se la risposta arriva al terzo
        # secondo esatto, senza questo il buzzer emetterebbe sia l'esito sia
        # il pattern "non raggiungibile".
        - script.stop: attesa_ha
        - lambda: |-
            if (esito == "ok")           id(suono_ok).execute();
            else if (esito == "allarme") id(suono_allarme).execute();
            else                         id(suono_ko).execute();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Il nodo esterno va su VLAN/SSID IoT isolata: è il dispositivo più esposto
  # dell'impianto e non deve poter raggiungere il resto della rete.
  ap:
    ssid: "RFID Ingresso Fallback"
    password: !secret ap_password

captive_portal:

# ───────────────────────────────────────────────────────────────────────────
#  Bus I²C — PN532 alimentato a 5V, bus a 50 kHz
#
#  50 kHz e non i 100 kHz di default: il PN532 su cavo lungo verso l'esterno
#  perde pacchetti a velocità piena.
# ───────────────────────────────────────────────────────────────────────────
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 50kHz
  scan: true

globals:
  - id: scan_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: window_id
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ───────────────────────────────────────────────────────────────────────────
#  Buzzer attivo: si pilota acceso/spento, non con la PWM.
# ───────────────────────────────────────────────────────────────────────────
switch:
  - platform: gpio
    pin: GPIO18
    id: buzzer
    restore_mode: ALWAYS_OFF

  # ═════════════════════════════════════════════════════════════════════════
  #  LETTURA ABILITATA
  #
  #  È l'interruttore che Home Assistant spegne quando il sistema va in
  #  allarme. Spegnere la lettura ferma l'inondazione ALLA RADICE: chi cicla
  #  codici con un Flipper non riesce nemmeno più a far arrivare un evento.
  #  Rifiutare le letture dopo averle ricevute non basterebbe — il traffico
  #  arriverebbe comunque.
  #
  #  `restore_mode: RESTORE_DEFAULT_ON`: dopo un blackout il lettore riparte
  #  funzionante. Un lettore che resta muto dopo un calo di tensione è un
  #  guasto silenzioso, e il caso quotidiano (il bambino che rientra) pesa
  #  più dello scenario in cui qualcuno stacca la corrente per riabilitare
  #  un lettore che comunque non aprirebbe niente da solo.
  # ═════════════════════════════════════════════════════════════════════════
  - platform: template
    name: "Lettura abilitata"
    id: lettura_abilitata
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:nfc-variant
    turn_on_action:
      - script.execute: led_pronto
    turn_off_action:
      - script.execute: led_bloccato

# ═══════════════════════════════════════════════════════════════════════════
#  LED di stato — RGB a CATODO COMUNE
#
#  Cablaggio, verificato accendendo un canale alla volta dall'entità `light`
#  e guardando il LED — non dedotto dalle marcature, ma qui le marcature
#  risultano corrette:
#
#     −  catodo comune   filo GIALLO  →  GND
#     R  rosso           filo VERDE   →  220Ω  →  GPIO25
#     G  verde           filo BLU     →  220Ω  →  GPIO26
#     B  blu             filo VIOLA   →  220Ω  →  GPIO27
#
#  I nomi dei fili non corrispondono ai canali (il filo verde porta il rosso),
#  ma la serigrafia R/G/B sì. È una distinzione che costa poco leggere e che
#  ha già fatto perdere un giro di diagnosi.
#
#  Le resistenze vanno messe comunque, anche se il LED sembra averle a bordo:
#  una in più lo rende appena più tenue, una in meno brucia il LED o il pin.
#
#  25/26/27 sono uscite pulite su ESP32: niente strapping all'avvio, nessun
#  conflitto con il WiFi.
#
#  Se il LED fosse ad ANODO COMUNE, il filo comune andrebbe a 3V3 e servirebbe
#  `inverted: true` su ciascun output.
# ═══════════════════════════════════════════════════════════════════════════
output:
  - platform: ledc
    pin: GPIO25
    id: canale_r
  - platform: ledc
    pin: GPIO26
    id: canale_g
  - platform: ledc
    pin: GPIO27
    id: canale_b

light:
  - platform: rgb
    name: "LED stato"
    id: led_stato
    red: canale_r
    green: canale_g
    blue: canale_b
    restore_mode: ALWAYS_OFF

# ═══════════════════════════════════════════════════════════════════════════
#  TAMPER
#
#  Modulo a 3 fili:  +  →  3V3  (NON 5V: i GPIO dell'ESP32 non tollerano i 5V)
#                    −  →  GND
#                    S  →  GPIO32
#
#  ⚠️ IL VERSO CONTA, E NON È SOLO ESTETICA.
#
#  Manomissione = circuito APERTO, mai chiuso. Se l'allarme scattasse a
#  contatto chiuso, basterebbe tranciare il cavetto per disattivare il tamper
#  in silenzio — cioè la prima cosa che farebbe chi vuole aprire la scatola.
#
#  Da qui la regola di montaggio, che vale qualunque sia la resistenza a
#  bordo del modulo:
#
#      IL COPERCHIO CHIUSO DEVE LASCIARE S ALTO.
#
#  Se il modulo porta S alto quando premuto, il coperchio lo preme.
#  Se lo porta basso, il coperchio lo lascia libero.
#  In entrambi i casi: chiuso = alto, aperto = basso.
#
#  Con il pull-down interno, un filo tagliato finisce basso esattamente come
#  un coperchio aperto — e fa allarme. È il comportamento che si vuole.
#
#  Lato Home Assistant serve un'automazione che chiami
#  `access_control.report_tamper` quando questo passa a `on`: il nodo segnala,
#  non decide.
# ═══════════════════════════════════════════════════════════════════════════
binary_sensor:
  # ═════════════════════════════════════════════════════════════════════════
  #  ALLARME DELL'IMPIANTO, LETTO DA HOME ASSISTANT
  #
  #  Il nodo non decide di bloccarsi: chiede, e obbedisce. La differenza
  #  conta, perche' e' quello che rende il blocco resistente al riavvio senza
  #  metterlo nella flash di un dispositivo che sta fuori casa.
  #
  #  ⚠️ Perche' non basta che il modulo spenga l'interruttore.
  #
  #  Quella e' una spinta: parte una volta, quando l'allarme scatta. Se il
  #  nodo si riavvia — blackout, aggiornamento, watchdog — riparte con la
  #  lettura accesa e nessuno gliela rispegne, perche' per Home Assistant
  #  l'allarme era gia' scattato e non scatta due volte. Il lettore tornerebbe
  #  a leggere mentre l'impianto e' bloccato.
  #
  #  Qui invece lo stato viene *tirato*: l'API lo consegna appena il
  #  collegamento si apre, a ogni avvio, senza che nessuno debba ricordarsi
  #  di rimandarlo.
  #
  #  Resta vero che il nodo riparte con la lettura accesa (RESTORE_DEFAULT_ON,
  #  vedi sopra): un lettore muto dopo un calo di tensione e' un guasto
  #  silenzioso, e quella scelta non cambia. Cambia che adesso la finestra in
  #  cui e' acceso a torto dura il tempo di collegarsi a Home Assistant,
  #  invece di durare finche' qualcuno se ne accorge — e in quella finestra
  #  comunque non apre niente, perche' ad aprire e' il modulo.
  # ═════════════════════════════════════════════════════════════════════════
  - platform: homeassistant
    id: allarme_impianto
    entity_id: ${entita_allarme}
    # Non serve rimandare a Home Assistant un'entita' che e' sua.
    internal: true
    on_press:
      - logger.log: "Impianto in allarme: lettura sospesa"
      - switch.turn_off: lettura_abilitata
    on_release:
      - logger.log: "Allarme rientrato: lettura riabilitata"
      - switch.turn_on: lettura_abilitata

  - platform: gpio
    name: "Tamper"
    id: tamper
    device_class: tamper
    pin:
      number: GPIO32
      mode:
        input: true
        # Pull-down, non pull-up: è ciò che fa risultare "aperto" anche un
        # filo staccato, invece di lasciarlo flottante a dire quel che capita.
        pulldown: true
      # Pin basso (aperto o tranciato) → sensore ON → manomissione.
      inverted: true
    filters:
      # Un microswitch rimbalza: senza questo, chiudere il coperchio
      # genererebbe un paio di allarmi fantasma.
      - delayed_on: 50ms
      - delayed_off: 200ms

pn532_i2c:
  update_interval: 500ms
  on_tag:
    then:
      # ═══════════════════════════════════════════════════════════════════
      #  1. Feedback immediato di lettura.
      #     25 ms, prima di ogni altra cosa: dice "ti ho letto" mentre la
      #     decisione è ancora in viaggio. Senza, fra l'avvicinare la
      #     tessera e la risposta di Home Assistant c'è un silenzio in cui
      #     non si sa se il lettore abbia visto qualcosa.
      #     Non rivela nulla: suona identico per ogni tessera.
      # ═══════════════════════════════════════════════════════════════════
      - script.execute: blip_lettura

      # 2. Lettura disabilitata (sistema in allarme): non si manda niente.
      - if:
          condition:
            switch.is_off: lettura_abilitata
          then:
            - logger.log: "Lettura disabilitata: scartata"
            - script.stop: led_censimento
            - script.execute: led_bloccato
            # Stesso bip di qualunque altro diniego, ed e' il punto.
            #
            # Un lettore che non risponde sembra rotto: e' il sintomo contro
            # cui esiste la regola "rispondere sempre, anche negando". E il
            # silenzio qui distingueva a orecchio "sei bloccato" da ogni altro
            # rifiuto, cioe' proprio l'informazione che il feedback non deve
            # far trapelare: chi cicla tessere capiva di aver fatto scattare
            # il blocco.
            #
            # Il LED, invece, resta rosso fisso: quello non e' il verdetto su
            # questa tessera, e' lo stato in cui si trova il lettore.
            - script.execute: bip_ko
          else:
            # 3. Rate limiter locale: max 3 letture ogni 10 s.
            #    Evita che una tessera appoggiata al lettore inondi l'API.
            #    Non è la difesa vera — chi sostituisce il firmware lo
            #    rimuove — quella sta dentro casa.
            - lambda: |-
                uint32_t w = millis() / 10000;
                if (w != id(window_id)) { id(window_id) = w; id(scan_count) = 0; }
                id(scan_count)++;
            - if:
                condition:
                  lambda: 'return id(scan_count) <= 3;'
                then:
                  # Prima del giallo: il ciclo del censimento ridipinge il LED
                  # ogni mezzo secondo e coprirebbe l'attesa. La finestra si
                  # chiude comunque su questa lettura — la spia sta solo
                  # smettendo con un attimo di anticipo su Home Assistant.
                  - script.stop: led_censimento
                  - script.execute: led_attesa
                  - script.execute: attesa_ha
                  # ═══════════════════════════════════════════════════════
                  #  4. Evento PROPRIO, non `homeassistant.tag_scanned`.
                  #     Vedi la nota in fondo: è ciò che tiene pulito il
                  #     registro tag di Home Assistant.
                  # ═══════════════════════════════════════════════════════
                  - homeassistant.event:
                      event: esphome.access_control_read
                      data:
                        lettore: ${nome_nodo}
                      data_template:
                        uid: "{{ codice }}"
                      variables:
                        # `!lambda` NON e' decorativo: senza il tag, ESPHome
                        # manda a Home Assistant il TESTO "return x;" invece
                        # dell'UID letto. Il template `{{ codice }}` allora si
                        # risolve in quella stringa e ogni tessera arriva al
                        # modulo con lo stesso codice — il registro censisce
                        # una tessera fantasma alla prima lettura e da li' in
                        # poi ogni altra tessera risulta "gia' censita".
                        codice: !lambda 'return x;'
                else:
                  - logger.log: "Rate limit attivo"
                  - script.execute: suono_ko

# ───────────────────────────────────────────────────────────────────────────
#  PATTERN ACUSTICI E LUMINOSI
#
#  Il feedback non rivela MAI il motivo del diniego: tessera sconosciuta,
#  disabilitata, in blacklist o valida fuori orario suonano tutte `ko`. Se il
#  buzzer le distinguesse, chi trova una tessera capirebbe che è censita e che
#  vale la pena tornare a un altro orario.
# ───────────────────────────────────────────────────────────────────────────
script:
  # Blip di lettura — 25 ms, appena il PN532 vede qualcosa
  - id: blip_lettura
    mode: restart
    then:
      - switch.turn_on: buzzer
      - delay: 25ms
      - switch.turn_off: buzzer

  # OK — due bip corti ravvicinati + LED verde
  - id: suono_ok
    mode: restart
    then:
      - script.execute: led_ok
      - switch.turn_on: buzzer
      - delay: 60ms
      - switch.turn_off: buzzer
      - delay: 80ms
      - switch.turn_on: buzzer
      - delay: 60ms
      - switch.turn_off: buzzer
      - delay: 1500ms
      - script.execute: led_pronto

  # Il bip di diniego, separato dal colore.
  #
  # Serve a chi deve suonare "no" tenendo un LED diverso da quello standard:
  # il lettore bloccato risponde con questo stesso bip, ma il suo rosso non e'
  # quello breve del rifiuto — e' lo stato in cui si trova, e resta.
  - id: bip_ko
    mode: restart
    then:
      - switch.turn_on: buzzer
      - delay: 1200ms
      - switch.turn_off: buzzer

  # KO — un bip lungo + LED rosso breve
  - id: suono_ko
    mode: restart
    then:
      - script.execute: led_ko
      - script.execute: bip_ko
      - script.wait: bip_ko
      - delay: 500ms
      - script.execute: led_pronto

  # ALLARME — bip alternati, poi rosso fisso finché non si sblocca
  - id: suono_allarme
    mode: restart
    then:
      - repeat:
          count: 4
          then:
            - switch.turn_on: buzzer
            - delay: 150ms
            - switch.turn_off: buzzer
            - delay: 150ms
      - script.execute: led_bloccato

  # HA non risponde — tre bip corti distanziati
  - id: attesa_ha
    mode: restart
    then:
      - delay: 3s
      - repeat:
          count: 3
          then:
            - switch.turn_on: buzzer
            - delay: 80ms
            - switch.turn_off: buzzer
            - delay: 400ms
      # Il giallo significa "sto aspettando". Finita l'attesa non si aspetta
      # piu' niente, e lasciarlo acceso e' una spia che mente: chi torna al
      # lettore lo trova giallo e crede che una decisione sia ancora in corso.
      # `led_pronto` sceglie da solo il colore vero — verde tenue se il
      # collegamento c'e', blu se e' caduto.
      - script.execute: led_pronto

  # LED a riposo: verde molto tenue = "sono qui e leggo".
  # Tenue di proposito: è una spia che sta fuori casa tutta la notte.
  - id: led_pronto
    mode: restart
    then:
      - if:
          condition:
            not:
              api.connected:
          then:
            - script.execute: led_scollegato
          else:
            - if:
                condition:
                  switch.is_on: lettura_abilitata
                then:
                  - light.turn_on:
                      id: led_stato
                      red: 0%
                      green: 100%
                      blue: 0%
                      brightness: 8%
                else:
                  - script.execute: led_bloccato

  # Verde pieno: accesso consentito
  - id: led_ok
    mode: restart
    then:
      - light.turn_on:
          id: led_stato
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%

  # Rosso pieno: rifiutato
  - id: led_ko
    mode: restart
    then:
      - light.turn_on:
          id: led_stato
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

  # Giallo: sto aspettando la risposta. Non è né un sì né un no, e restare sul
  # verde farebbe credere che sia già andata.
  - id: led_attesa
    mode: restart
    then:
      - light.turn_on:
          id: led_stato
          red: 100%
          green: 80%
          blue: 0%
          brightness: 70%

  # Rosso fisso: il lettore non legge più (sistema in allarme)
  - id: led_bloccato
    mode: restart
    then:
      - light.turn_on:
          id: led_stato
          red: 100%
          green: 0%
          blue: 0%
          brightness: 60%

  # ═══════════════════════════════════════════════════════════════════════
  #  Bianco pulsante: censimento aperto, la prossima tessera viene registrata.
  #
  #  Pulsa invece di stare fisso perche' e' uno stato che scade: un colore
  #  fermo si legge come "il lettore e' cosi'", uno che respira come "sta
  #  aspettando qualcosa". E' l'unico momento in cui il lettore dice qualcosa
  #  dello stato dell'impianto a chi lo guarda da fuori, e dura al massimo un
  #  minuto: passato quello, o letta la tessera, torna a mentire zero.
  #
  #  Il ciclo lo ferma `script.stop`, da Home Assistant quando la finestra si
  #  chiude e localmente appena arriva una lettura.
  # ═══════════════════════════════════════════════════════════════════════
  - id: led_censimento
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - light.turn_on:
                id: led_stato
                red: 100%
                green: 100%
                blue: 100%
                brightness: 80%
                transition_length: 400ms
            - delay: 500ms
            - light.turn_on:
                id: led_stato
                red: 100%
                green: 100%
                blue: 100%
                brightness: 8%
                transition_length: 400ms
            - delay: 500ms

  # ═══════════════════════════════════════════════════════════════════════
  #  Blu fisso: il nodo non parla con Home Assistant.
  #
  #  È il colore che il terzo canale ci ha regalato, e serve più di quanto
  #  sembri: senza, un lettore isolato dalla rete e un lettore bloccato per
  #  allarme sono indistinguibili da fuori — entrambi non aprono. Ma vogliono
  #  due interventi opposti: uno è "guarda il WiFi", l'altro è "sblocca
  #  l'impianto". Chi arriva alla porta deve poterlo capire senza entrare.
  # ═══════════════════════════════════════════════════════════════════════
  - id: led_scollegato
    mode: restart
    then:
      - light.turn_on:
          id: led_stato
          red: 0%
          green: 0%
          blue: 100%
          brightness: 40%

button:
  - platform: template
    name: "Test suono OK"
    on_press:
      - script.execute: suono_ok
  - platform: template
    name: "Test suono KO"
    on_press:
      - script.execute: suono_ko
  - platform: template
    name: "Test suono attesa"
    on_press:
      - script.execute: attesa_ha
  - platform: template
    name: "Test suono allarme"
    on_press:
      - script.execute: suono_allarme

  # Prova dei colori senza passare una tessera: serve a capire subito se
  # bianco e grigio sono invertiti, prima di montare tutto nella scatola.
  - platform: template
    name: "Test LED verde"
    on_press:
      - script.execute: led_ok
  - platform: template
    name: "Test LED rosso"
    on_press:
      - script.execute: led_ko
  - platform: template
